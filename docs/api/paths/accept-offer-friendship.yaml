post:
  tags:
    - Offer friendships
  summary: Принять предложение дружбы
  description: |
    Принимает заявку по участникам `fromUserId` (отправитель) и `toUserId` (получатель).
    Текущий пользователь должен быть получателем (`toUserId`).

    Первое успешное принятие из статуса `PENDING` переводит заявку в `ACCEPTED` и возвращает `200` с JSON заявки.

    Повторное принятие при статусе `ACCEPTED` — `204 No Content` без тела.

    Принять заявку в статусе `REJECTED` нельзя — `409 Conflict`.

    При принятии создаются взаимная дружба и обратная
    подписка получателя на отправителя.
    Подписка отправителя сохраняется.
    Все изменения сохраняются атомарно.
  operationId: acceptOfferFriendship
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/OfferFriendshipParticipantsRequest'
        examples:
          default:
            summary: Пользователь 2 принимает заявку от пользователя 1
            value:
              fromUserId: 1
              toUserId: 2
  responses:
    '200':
      description: Заявка принята (переход из PENDING в ACCEPTED)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/OfferFriendship'
          examples:
            accepted:
              value:
                id: 10
                fromUserId: 1
                toUserId: 2
                status: ACCEPTED
                createdAt: '2026-10-29T10:00:00Z'
    '204':
      description: |
        Повторное принятие при статусе `ACCEPTED`.
        Состояние не меняется, дубликаты не создаются.
    '400':
      description: |
        Отсутствует обязательное поле или значение передано неправильного типа.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiError'
          examples:
            invalidFormat:
              value:
                code: VALIDATION_ERROR
                message: Некорректный формат запроса
    '401':
      description: Пользователь не авторизован
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiError'
          examples:
            unauthorized:
              value:
                code: UNAUTHORIZED
                message: Необходима авторизация
    '403':
      description: Принять может только получатель заявки
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiError'
          examples:
            forbiddenActor:
              value:
                code: FORBIDDEN
                message: Принять предложение может только его получатель
    '404':
      description: Заявка не найдена
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiError'
          examples:
            notFound:
              value:
                code: OFFER_NOT_FOUND
                message: Предложение дружбы не найдено
    '409':
      description: Нельзя принять отклонённое предложение
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiError'
          examples:
            alreadyRejected:
              value:
                code: CANNOT_ACCEPT_REJECTED_OFFER
                message: Нельзя принять отклонённое предложение
