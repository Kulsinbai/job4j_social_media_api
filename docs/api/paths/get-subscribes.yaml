get:
  tags:
    - Subscribes
  summary: Получить свои подписки
  description: |
    Возвращает пользователей, на которых подписан текущий пользователь.
    Запрос только для чтения, данные не изменяются.
  operationId: getSubscribes
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Список подписок (может быть пустым)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/UserIdList'
          examples:
            withSubscriptions:
              summary: Текущий пользователь подписан на 4 и 5
              value:
                - userId: 4
                - userId: 5
            empty:
              value: []
    '401':
      description: Пользователь не авторизован
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiError'
          examples:
            unauthorized:
              value:
                code: UNAUTHORIZED
                message: Необходима авторизация
